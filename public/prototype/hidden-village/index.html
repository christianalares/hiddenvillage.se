<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#19222b" />
    <title>Hidden Village | Walk prototype</title>
    <link rel="stylesheet" href="/prototype/hidden-village/style.css" />
  </head>
  <body>
    <main class="shell">
      <div id="mount" class="canvas" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="topline"><span class="brand">HIDDEN VILLAGE</span></div>
      <div class="caption" aria-live="polite">
        <span id="place" class="place">THE RIDGE</span>
        <h1 id="caption">Hidden Village</h1>
        <p id="description">A light in the woods. A path worth following.</p>
        <a id="contact" href="mailto:christian@hiddenvillage.se" hidden>Write to Christian</a>
      </div>
      <div class="controls">
        <span id="instruction">Scroll, swipe, or use arrow keys to walk</span>
        <div class="track"><div id="progress" class="fill"></div></div>
      </div>
    </main>
    <script type="module" src="/prototype/hidden-village/scene.js"></script>
  </body>
</html>
